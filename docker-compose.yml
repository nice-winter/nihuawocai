name: ${REPO_NAME}

services:
  nitro:
    image: ${REPOSITORY:-${COMPOSE_PROJECT_NAME}}/nitro:${TAG:-latest}
    container_name: nitro
    environment:
      NODE_ENV: production
    env_file:
      - ./.env
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        CI: ${CI:-false}
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app-network
    ports:
      - '${NITRO_PORT:-3000}:3000'
    volumes:
      - 'data:./app/.data'
      - 'logs:./app/.logs'

networks:
  app-network:
    driver: bridge

volumes:
  data:
  logs:
